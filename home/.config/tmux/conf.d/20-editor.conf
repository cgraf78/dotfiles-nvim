# Editor-aware pane, tab, and link routing. The base tmux configuration owns
# general session, clipboard, status, and persistence policy.
set -g mouse on

is_vim_native="#{m/r:^g?(view|l?n?vim?x?|fzf)(diff)?$,#{pane_current_command}}"
is_terminal_app_native="#{||:#{m/r:^(g?(view|l?n?vim?x?|fzf)(diff)?|ssh|mosh|mosh-client|mosh-server|et)$,#{pane_current_command}},#{&&:#{mouse_any_flag},#{m/r:^(tmux|screen)(:.*)?$,#{pane_current_command}}}}"
is_vim="ps -o state= -o ucomm= -o pgid= -o tpgid= -t '#{pane_tty}' | awk '\$3 == \$4 && \$1 !~ /^[TXZ]/ && \$2 ~ /^g?(view|l?n?vim?x?|fzf)(diff)?$/ { found = 1 } END { exit !found }'"
is_terminal_app="ps -o state= -o ucomm= -o pgid= -o tpgid= -t '#{pane_tty}' | awk -v mouse='#{mouse_any_flag}' '\$1 !~ /^[TXZ]/ && \$(NF-1) == \$(NF) && (\$2 ~ /^(g?(view|l?n?vim?x?|fzf)(diff)?|ssh|mosh|mosh-client|mosh-server|et)$/ || (mouse == 1 && \$2 ~ /^(tmux|screen):?$/)) { found = 1 } END { exit !found }'"
is_pane_navigation_native="#{||:$is_vim_native,#{&&:#{mouse_any_flag},$is_terminal_app_native}}"
is_pane_navigation="ps -o state= -o ucomm= -o pgid= -o tpgid= -t '#{pane_tty}' | awk -v mouse='#{mouse_any_flag}' '\$1 !~ /^[TXZ]/ && \$(NF-1) == \$(NF) && (\$2 ~ /^g?(view|l?n?vim?x?|fzf)(diff)?$/ || (mouse == 1 && \$2 ~ /^(ssh|mosh|mosh-client|mosh-server|et|tmux|screen):?$/)) { found = 1 } END { exit !found }'"

send_ctrl_tab="send-keys Escape '[9;5u'"
send_ctrl_shift_tab="send-keys Escape '[9;6u'"
# The inherited base fragment owns navigate_origin_args so every Termnav route
# uses one exact origin-metadata contract. Boundary actions explicitly start at
# the parent; host-local pane movement starts in this tmux scope.
switch_tab_next="run-shell '~/.local/bin/termnav navigate tab-select next --parent $navigate_origin_args'"
switch_tab_previous="run-shell '~/.local/bin/termnav navigate tab-select previous --parent $navigate_origin_args'"
select_parent_pane_left="run-shell '~/.local/bin/termnav navigate pane-select left --parent $navigate_origin_args'"
select_parent_pane_down="run-shell '~/.local/bin/termnav navigate pane-select down --parent $navigate_origin_args'"
select_parent_pane_up="run-shell '~/.local/bin/termnav navigate pane-select up --parent $navigate_origin_args'"
select_parent_pane_right="run-shell '~/.local/bin/termnav navigate pane-select right --parent $navigate_origin_args'"
move_pane_left="run-shell '~/.local/bin/termnav navigate pane-move left $navigate_origin_args'"
move_pane_down="run-shell '~/.local/bin/termnav navigate pane-move down $navigate_origin_args'"
move_pane_up="run-shell '~/.local/bin/termnav navigate pane-move up $navigate_origin_args'"
move_pane_right="run-shell '~/.local/bin/termnav navigate pane-move right $navigate_origin_args'"
send_alt_shift_left_bracket="send-keys Escape '{'"
send_alt_shift_right_bracket="send-keys Escape '}'"
move_parent_tab_left="run-shell '~/.local/bin/termnav navigate tab-move left --parent $navigate_origin_args'"
move_parent_tab_right="run-shell '~/.local/bin/termnav navigate tab-move right --parent $navigate_origin_args'"

# Base owns the transport-aware M-{ / M-} bindings. Rebind them after the
# editor detector is defined so Nvim and fzf panes keep the pre-split behavior;
# tmux expands these variables while parsing, not when a key is later pressed.
bind-key -n 'M-{' if-shell -F "$is_terminal_app_native" "$send_alt_shift_left_bracket" { if-shell "$is_terminal_app" "$send_alt_shift_left_bracket" { if-shell -F '#{==:#{session_windows},1}' "$move_parent_tab_left" { if-shell -F '#{>:#{window_index},#{base-index}}' 'swap-window -d -t :-' 'display-message -p ""' } } }
bind-key -n 'M-}' if-shell -F "$is_terminal_app_native" "$send_alt_shift_right_bracket" { if-shell "$is_terminal_app" "$send_alt_shift_right_bracket" { if-shell -F '#{==:#{session_windows},1}' "$move_parent_tab_right" { if-shell -F '#{<:#{window_index},#{e|+:#{base-index},#{e|-:#{session_windows},1}}}' 'swap-window -d -t :+' 'display-message -p ""' } } }

bind-key -n C-Tab if-shell -F "$is_pane_navigation_native" "$send_ctrl_tab" { if-shell "$is_pane_navigation" "$send_ctrl_tab" { if-shell -F '#{>:#{session_windows},1}' 'next-window' "$switch_tab_next" } }
bind-key -n C-BTab if-shell -F "$is_pane_navigation_native" "$send_ctrl_shift_tab" { if-shell "$is_pane_navigation" "$send_ctrl_shift_tab" { if-shell -F '#{>:#{session_windows},1}' 'previous-window' "$switch_tab_previous" } }
bind-key -n 'C-h' if-shell -F "$is_pane_navigation_native" 'send-keys C-h' { if-shell "$is_pane_navigation" 'send-keys C-h' { if-shell -F '#{pane_at_left}' "$select_parent_pane_left" 'select-pane -L' } }
bind-key -n 'C-j' if-shell -F "$is_pane_navigation_native" 'send-keys C-j' { if-shell "$is_pane_navigation" 'send-keys C-j' { if-shell -F '#{pane_at_bottom}' "$select_parent_pane_down" 'select-pane -D' } }
bind-key -n 'C-k' if-shell -F "$is_pane_navigation_native" 'send-keys C-k' { if-shell "$is_pane_navigation" 'send-keys C-k' { if-shell -F '#{pane_at_top}' "$select_parent_pane_up" 'select-pane -U' } }
bind-key -n 'C-l' if-shell -F "$is_pane_navigation_native" 'send-keys C-l' { if-shell "$is_pane_navigation" 'send-keys C-l' { if-shell -F '#{pane_at_right}' "$select_parent_pane_right" 'select-pane -R' } }
bind-key -n 'M-H' if-shell -F "$is_pane_navigation_native" "send-keys Escape 'H'" { if-shell "$is_pane_navigation" "send-keys Escape 'H'" "$move_pane_left" }
bind-key -n 'M-J' if-shell -F "$is_pane_navigation_native" "send-keys Escape 'J'" { if-shell "$is_pane_navigation" "send-keys Escape 'J'" "$move_pane_down" }
bind-key -n 'M-K' if-shell -F "$is_pane_navigation_native" "send-keys Escape 'K'" { if-shell "$is_pane_navigation" "send-keys Escape 'K'" "$move_pane_up" }
bind-key -n 'M-L' if-shell -F "$is_pane_navigation_native" "send-keys Escape 'L'" { if-shell "$is_pane_navigation" "send-keys Escape 'L'" "$move_pane_right" }
bind-key -n 'C-\' if-shell -F "$is_pane_navigation_native" 'send-keys C-\\' { if-shell "$is_pane_navigation" 'send-keys C-\\' 'select-pane -l' }

bind-key -n C-MouseDown1Pane if-shell -F '#{mouse_any_flag}' 'send-keys -M' 'select-pane -t ='
bind-key -n C-MouseDrag1Pane if-shell -F '#{mouse_any_flag}' 'send-keys -M' 'display-message -p ""'
bind-key -n C-MouseUp1Pane if-shell -F '#{mouse_any_flag}' 'send-keys -M' 'run-shell -b "~/.local/bin/termnav tmux follow-click --stdin <<\"__DOT_TMUX_CLICK__\"\n#{mouse_hyperlink}\n#{mouse_word}\n#{mouse_line}\n#{mouse_x}\n#{pane_current_path}\n#{client_tty}\n#{pane_id}\n#{mouse_y}\n#{pane_top}\n#{pane_left}\n__DOT_TMUX_CLICK__"'

bind -n C-S-v send-keys Escape '[778899~'
bind e command-prompt -p 'nvim-open:' { run-shell '~/.local/bin/termnav nvim open link "%%"' }
