# Editor integrations that need Neovim. The base tmux configuration owns mouse
# mode and the editor-aware pane, tab, and link routing these keys sit beside.
bind -N "Paste through the editor terminal integration" -n C-S-v send-keys Escape '[778899~'
bind -N "Open a file or link in Neovim" e command-prompt -p 'nvim-open:' { run-shell '~/.local/bin/termnav nvim open link "%%"' }
