name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    uses: cgraf78/actions/.github/workflows/shell-ci.yml@cff4d77cf738c278a8c1279a89b20c9c546d9c5b
    with:
      setup: none
      matrix-set: full
      profiles: base,jq,python,lua,neovim,tmux,ripgrep,fd,procps
      shellcheck-exclude-codes: SC1091
      shellcheck-inventory-path: .github/shellcheck-files.txt
      test-command: test/run

  actions-sync:
    name: cgraf78/actions sync
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cgraf78/actions/.github/actions/verify-consumer-sync@cff4d77cf738c278a8c1279a89b20c9c546d9c5b

      - name: Verify public repository and license
        env:
          GH_TOKEN: ${{ github.token }}
        run: test/workflow-test --remote
