name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    uses: cgraf78/actions/.github/workflows/shell-ci.yml@d08e7db3c8a0cc3c31305f80902507878f3befe1
    with:
      setup: none
      matrix-set: full
      profiles: base,jq,python,lua,neovim,tmux,ripgrep,fd,procps
      shellcheck-exclude-codes: SC1091
      shellcheck-inventory-path: .github/shellcheck-files.txt
      test-command: test/run

  installed-profiles:
    name: Installed profiles
    # This overlay's own suites run without base or dotfiles-dev installed.
    # The base gate installs this pull request's revision into real homes and
    # runs their `dot test`, so a change that is only wrong once composed
    # fails before it lands. It tracks base main on purpose: hosts run base
    # main, so that is the combination to test.
    uses: cgraf78/dotfiles/.github/workflows/installed-profiles.yml@main # zizmor: ignore[unpinned-uses]
    with:
      nvim-revision: ${{ github.event.pull_request.head.sha || github.sha }}
      # The editor home is base plus this overlay; the dev home adds
      # dotfiles-dev. nvim-test defers its editor-only checks to the editor
      # home whenever dev is installed, so both homes are needed. The base
      # home cannot change with this revision, and the size budgets are base's.
      profiles: editor dev
      footprint: false
      # The upgrade/downgrade lifecycle, `dot doctor`, and the cross-repository
      # ownership and composition checks all install this overlay's content,
      # but base CI only runs them with this overlay at main.
      lifecycle: true
      stack: true

  actions-sync:
    name: cgraf78/actions sync
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Name checkout's throwaway initial branch so Git skips its hint.
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          persist-credentials: false
      - uses: cgraf78/actions/.github/actions/verify-consumer-sync@d08e7db3c8a0cc3c31305f80902507878f3befe1

      - name: Verify public repository and license
        env:
          GH_TOKEN: ${{ github.token }}
        run: test/workflow-test --remote
